name: ios-testflight
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'رفع إلى TestFlight (يتطلب سجل التطبيق في App Store Connect). إيقافه = بناء وتوقيع فقط'
        type: boolean
        default: false
      marketing_version:
        description: 'رقم الإصدار الظاهر (مثل 1.0.0)'
        required: true
        default: '1.0.0'
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm install
      - name: add iOS project (deployment target 14 for social-login)
        run: |
          npx cap add ios || true
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -n "platform :ios" ios/App/Podfile
          cd ios/App && pod install
      - name: icon, splash, entitlements, Info.plist
        run: |
          A=ios/App/App
          cp resources/icon.png "$A/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          for f in "$A"/Assets.xcassets/Splash.imageset/*.png; do cp resources/splash.png "$f"; done
          cp ci/App.entitlements "$A/App.entitlements"
          P="$A/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string remote-notification" "$P" || true
          cat "$P" | head -60
      - run: npx cap sync ios
      - name: App Store Connect key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          sed -i '' "s/__TEAM_ID__/${TEAM_ID}/" ci/ExportOptions.plist
      - name: Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION="${{ inputs.marketing_version }}" \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | xcbeautify || exit ${PIPESTATUS[0]}
      - name: Export and upload
        if: ${{ inputs.upload }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove key
        if: always()
        run: rm -rf ~/private_keys
