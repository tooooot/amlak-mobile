name: android-debug
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: remove ad permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          for P in com.google.android.gms.permission.AD_ID android.permission.ACCESS_ADSERVICES_ATTRIBUTION android.permission.ACCESS_ADSERVICES_AD_ID android.permission.ACCESS_ADSERVICES_CUSTOM_AUDIENCE; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"$P\" tools:node=\"remove\"/>\n</manifest>#" $M
          done
          cat $M
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: amlaki-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
