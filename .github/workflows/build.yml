name: android-debug
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: remove ad permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          for P in com.google.android.gms.permission.AD_ID android.permission.ACCESS_ADSERVICES_ATTRIBUTION android.permission.ACCESS_ADSERVICES_AD_ID android.permission.ACCESS_ADSERVICES_CUSTOM_AUDIENCE; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"$P\" tools:node=\"remove\"/>\n</manifest>#" $M
          done
          cat $M
      - run: npx cap sync android
      - name: sign with upload key
        run: |
          echo "$KS_B64" | base64 -d > android/upload.jks
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  upload {
                      storeFile file('../upload.jks')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.upload }
                  release { signingConfig signingConfigs.upload }
              }
          }
          EOF
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: amlaki-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
